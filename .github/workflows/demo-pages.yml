# 管理UIの AWS を使わないデモビルドを GitHub Pages へ公開する
name: demo-pages

on:
  push:
    branches: [main]
    paths:
      - packages/web/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @okibasho/web build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/web/dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
